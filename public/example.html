<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo Phaser - Boneco Carol</title>
  
  <!-- Phaser 3 via CDN -->
   <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #2d2d2d;
      font-family: Arial, sans-serif;
    }
    
    #game-container {
      border: 4px solid #e91e63;
      border-radius: 10px;
      overflow: hidden;
    }
    
    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 14px;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
    }

    /* Overlay pixelado */
.item-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  z-index: 9999;
  justify-content: center;
  align-items: center;
  font-family: 'Press Start 2P', cursive;
}

.item-overlay.show {
  display: flex;
}

.item-box {
  background: linear-gradient(135deg, #ffe0ec 0%, #ffc2d4 100%);
  border: 4px solid #ad1457;
  border-radius: 4px;
  padding: 30px 40px;
  text-align: center;
  box-shadow: 
    0 0 0 4px #ffe0ec,
    0 0 0 8px #ad1457,
    0 10px 40px rgba(173, 20, 87, 0.5);
  image-rendering: pixelated;
  animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 400px;
}

@keyframes popIn {
  from { 
    opacity: 0; 
    transform: scale(0.5); 
  }
  to { 
    opacity: 1; 
    transform: scale(1); 
  }
}

.item-title {
  font-family: 'Press Start 2P', cursive;
  font-size: 16px;
  color: #ad1457;
  margin-bottom: 20px;
  text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
  letter-spacing: 2px;
}

.item-icon {
  font-size: 60px;
  margin: 20px 0;
  animation: bounce 1s ease-in-out infinite;
  filter: drop-shadow(0 5px 10px rgba(233, 30, 99, 0.4));
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.item-desc {
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  color: #880e4f;
  margin-bottom: 25px;
  line-height: 1.6;
}

.item-hint {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  color: #ad1457;
  animation: blink 1s step-end infinite;
  margin-top: 15px;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

  </style>
</head>
<body>

  <div class="info">
    <strong>Controles:</strong><br>
    W = Cima<br>
    A = Esquerda<br>
    S = Baixo<br>
    D = Direita
  </div>
  <!-- Overlay de "Item encontrado" -->
<div id="itemOverlay" class="item-overlay">
  <div class="item-box">
    <div class="item-title">✨ ITEM ENCONTRADO </div>
    <div class="item-icon">💗</div>
    <div class="item-desc">Uma carta especial!</div>
    <div class="item-hint">Pressione ENTER para continuar</div>
  </div>
</div>

  <div id="game-container"></div>

  <script src="example.js"></script>
</body>
</html>
